<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medgud - Menú privado</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body { margin: 0; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>

  <script>
    function showError(title, detail) {
      var root = document.getElementById("root");
      if (!root) return;
      root.innerHTML =
        '<pre style="white-space:pre-wrap;padding:16px;margin:0;color:#7f1d1d;background:#fee2e2;font-family:monospace;font-size:12px;line-height:1.5;">' +
        '⚠ ' + title + '\n\n' + detail +
        '</pre>';
    }
    window.addEventListener('error', function (e) {
      showError('Error al cargar la app', (e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var reason = e.reason && e.reason.message ? e.reason.message : e.reason;
      showError('Error al cargar la app (promesa)', String(reason));
    });
  </script>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#0369a1;">
      Cargando…
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
